<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игра о внедрении ИТ-системы управления ТОиР</title><link rel="stylesheet" href="style-v3.css"></head><body><main id="app"></main><script>
const people={male:[['Алексей','Директивный','character-alexey-v06.webp','Быстро фиксирует решение, границу шага и ответственного. Сильная сторона — темп и управляемость. Риск — сопротивление там, где команде нужно обсуждение.'],['Михаил','Системный','character-mikhail-v06.webp','Начинает с причин, зависимостей и проверяемых данных. Сильная сторона — качество подготовки. Риск — слишком долго готовиться к первому действию.'],['Денис','Вовлекающий','character-denis-v06.webp','Подключает исполнителей к разбору реальной работы. Сильная сторона — поддержка команды. Риск — не зафиксировать границы решения и ответственность.'],['Игорь','Осторожный','character-igor-v05.webp','Снижает риск через ограниченную проверку и стоп-условие. Сильная сторона — надёжность решения. Риск — потерять темп в срочной ситуации.']],female:[['Александра','Директивный','character-alexandra-v05.webp','Быстро фиксирует решение, границу шага и ответственного. Сильная сторона — темп и управляемость. Риск — сопротивление там, где команде нужно обсуждение.'],['Марина','Системный','character-marina-v07.webp','Начинает с причин, зависимостей и проверяемых данных. Сильная сторона — качество подготовки. Риск — слишком долго готовиться к первому действию.'],['Дарья','Вовлекающий','character-darya-v06.webp','Подключает исполнителей к разбору реальной работы. Сильная сторона — поддержка команды. Риск — не зафиксировать границы решения и ответственность.'],['Ирина','Осторожный','character-irina-v07.webp','Снижает риск через ограниченную проверку и стоп-условие. Сильная сторона — надёжность решения. Риск — потерять темп в срочной ситуации.']]};
let gender,person,slide=0,personIndex=0;const app=document.querySelector('#app');const intro=[['НОВАЯ СИСТЕМА ЕЩЁ НЕ СТАЛА ЧАСТЬЮ РАБОТЫ.','На предприятии начинается внедрение ИТ-системы управления ТОиР. До пилота нужно проверить данные и порядок работы — иначе система останется формальностью.'],['ДО ПИЛОТА ОСТАЛОСЬ ВОСЕМЬ НЕДЕЛЬ.','Нужно проверить данные, процесс, роли и фактическую работу.'],['ПЕРВЫЕ ДАННЫЕ УЖЕ НЕ СХОДЯТСЯ.','Часть работ закрывается вне системы. Ваша задача — увидеть разрыв и не обещать результат раньше проверки.']];
function renderIntro(){const s=intro[slide];app.innerHTML=`<section class="intro"><div class="card"><b>${slide+1} / 3</b><p>ИНТЕРАКТИВНАЯ ИГРА О ВНЕДРЕНИИ ИТ-СИСТЕМЫ УПРАВЛЕНИЯ ТОиР</p><h1>${s[0]}</h1><span>${s[1]}</span><div><button class="plain" id="skip">К выбору персонажа</button><button id="next">${slide<2?'Далее':'Выбрать персонажа'}</button></div></div></section>`;next.onclick=()=>slide<2?(slide++,renderIntro()):renderGender();skip.onclick=renderGender}
function renderGender(){app.innerHTML=`<section class="gender-screen"><header class="gender-copy"><p>ВЫБОР ПЕРСОНАЖА · ШАГ 1 ИЗ 2</p><h1>ЗА КОГО БУДЕТЕ ИГРАТЬ?</h1><span>Сначала выберите образ. Затем вы сможете выбрать одного из четырёх персонажей с разными управленческими подходами.</span></header><div class="gender-stage"><button class="gender-option male" data-g="male"><img src="character-alexey-v06.webp" alt="Мужской персонаж"><span><b>Мужской образ</b><small>Алексей · Михаил · Денис · Игорь</small></span></button><button class="gender-option female" data-g="female"><img src="character-alexandra-v05.webp" alt="Женский персонаж"><span><b>Женский образ</b><small>Александра · Марина · Дарья · Ирина</small></span></button></div><footer>Выбор образа не влияет на условия игры и стартовые показатели.</footer></section>`;document.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{gender=x.dataset.g;personIndex=0;renderPeople()})}
function renderPeople(){const x=people[gender][personIndex];app.innerHTML=`<section class="character-screen"><div class="character-art"><img src="${x[2]}" alt="${x[0]}"></div><div class="character-copy"><p>ВЫБОР ПЕРСОНАЖА · ШАГ 2 ИЗ 2</p><h1>${x[0]}</h1><h2>${x[1]} подход</h2><span>${x[3]}</span><div class="carousel-controls"><button id="prev" aria-label="Предыдущий персонаж">←</button><strong>${personIndex+1} / 4</strong><button id="nextPerson" aria-label="Следующий персонаж">→</button></div><button class="choose" id="choose">Выбрать персонажа</button><button class="back" id="back">← Вернуться к выбору образа</button></div></section>`;prev.onclick=()=>{personIndex=(personIndex+3)%4;renderPeople()};nextPerson.onclick=()=>{personIndex=(personIndex+1)%4;renderPeople()};back.onclick=renderGender;choose.onclick=()=>{person=x;renderDirector()}}
function renderDirector(){app.innerHTML=`<section class="director"><div class="card"><p>ВСТРЕЧА С ДИРЕКТОРОМ · ПЕРВЫЙ РАУНД</p><h1>Пилот нужен к восьмой неделе.</h1><span>«Назовите границу пилота и ответственного. Производственный эффект обсудим после проверки исходных данных».</span><div class="selected"><b>${person[0]}</b> · ${person[1]} подход</div><button id="reply">Ответить директору</button><small id="hint">Выслушайте задачу директора. Затем выберите ответ.</small></div></section>`;reply.onclick=()=>{hint.textContent='Демонстрационный фрагмент завершён. Полная игра продолжает ситуацию проверкой фактов и первым решением.';reply.disabled=true}}
renderIntro();
</script></body></html>
