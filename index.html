<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игра о внедрении ИТ-системы управления ТОиР</title><link rel="stylesheet" href="style.css"></head><body><main id="app"></main><script>
const people={male:[['Алексей','Директивный','character-alexey-v06.webp'],['Михаил','Системный','character-mikhail-v06.webp'],['Денис','Вовлекающий','character-denis-v06.webp'],['Игорь','Осторожный','character-igor-v05.webp']],female:[['Александра','Директивный','character-alexandra-v05.webp'],['Марина','Системный','character-marina-v07.webp'],['Дарья','Вовлекающий','character-darya-v06.webp'],['Ирина','Осторожный','character-irina-v07.webp']]};let gender,person,slide=0;const app=document.querySelector('#app');const intro=[['СИСТЕМА ВЫБРАНА. РАБОТА ПОКА ЖИВЁТ ПО-СТАРОМУ.','На предприятии начинается внедрение ИТ-системы управления ТОиР. Пилот нужно подготовить, не подменяя работу красивым отчётом.'],['ДО ПИЛОТА ОСТАЛОСЬ ВОСЕМЬ НЕДЕЛЬ.','Нужно проверить данные, процесс, роли и фактическую работу.'],['ПЕРВЫЕ ДАННЫЕ УЖЕ НЕ СХОДЯТСЯ.','Часть работ закрывается вне системы. Ваша задача — увидеть разрыв и не обещать результат раньше проверки.']];
function renderIntro(){let s=intro[slide];app.innerHTML=`<section class="intro"><div class="card"><b>${slide+1} / 3</b><p>ИНТЕРАКТИВНАЯ ИГРА О ВНЕДРЕНИИ ИТ-СИСТЕМЫ УПРАВЛЕНИЯ ТОиР</p><h1>${s[0]}</h1><span>${s[1]}</span><div><button class="plain" id="skip">К выбору персонажа</button><button id="next">${slide<2?'Далее':'Выбрать персонажа'}</button></div></div></section>`;next.onclick=()=>slide<2?(slide++,renderIntro()):renderGender();skip.onclick=renderGender}
function renderGender(){app.innerHTML=`<section class="shell"><header><p>ШАГ 1 ИЗ 2</p><h1>ЗА КОГО БУДЕТЕ ИГРАТЬ?</h1><span>Выберите образ героя. Затем откроются четыре персонажа с разными управленческими подходами.</span></header><section class="grid">${[['male','МУЖСКОЙ ОБРАЗ','Алексей · Михаил · Денис · Игорь','character-alexey-v06.webp'],['female','ЖЕНСКИЙ ОБРАЗ','Александра · Марина · Дарья · Ирина','character-alexandra-v05.webp']].map(x=>`<button class="hero" data-g="${x[0]}"><img src="${x[3]}" alt=""><b>${x[1]}</b><small>${x[2]}</small></button>`).join('')}</section><footer>Выбор образа не влияет на условия игры и стартовые показатели.</footer></section>`;document.querySelectorAll('[data-g]').forEach(x=>x.onclick=()=>{gender=x.dataset.g;renderPeople()})}
function renderPeople(){app.innerHTML=`<section class="shell"><header><p>ШАГ 2 ИЗ 2</p><h1>ВЫБЕРИТЕ ПЕРСОНАЖА</h1><span>Подход влияет на реплики и привычный способ подготовки решений. Стартовые показатели у всех одинаковые.</span></header><section class="people">${people[gender].map((x,i)=>`<button class="person" data-i="${i}"><img src="${x[2]}" alt=""><span><b>${x[0]}</b><small>${x[1]} подход</small></span></button>`).join('')}</section><button class="back" id="back">← Изменить образ</button></section>`;back.onclick=renderGender;document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{person=people[gender][+x.dataset.i];renderDirector()})}
function renderDirector(){app.innerHTML=`<section class="director"><div class="card"><p>ВСТРЕЧА С ДИРЕКТОРОМ · ПЕРВЫЙ РАУНД</p><h1>Пилот нужен к восьмой неделе.</h1><span>«Назовите границу пилота и ответственного. Производственный эффект обсудим после проверки исходных данных».</span><div class="selected"><b>${person[0]}</b> · ${person[1]} подход</div><button id="reply">Ответить директору</button><small id="hint">Выслушайте задачу директора. Затем выберите ответ.</small></div></section>`;reply.onclick=()=>{hint.textContent='Демонстрационный фрагмент завершён. Полная игра продолжает ситуацию проверкой фактов и первым решением.';reply.disabled=true}}
renderIntro();
</script></body></html>
