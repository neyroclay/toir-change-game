<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Игра о внедрении ИТ-системы управления ТОиР</title><link rel="stylesheet" href="style.css"></head><body><main><header><p>ИНТЕРАКТИВНАЯ ИГРА О ВНЕДРЕНИИ ИТ-СИСТЕМЫ УПРАВЛЕНИЯ ТОиР</p><h1>ЗА КОГО БУДЕТЕ ИГРАТЬ?</h1><span>Выберите образ героя. Затем откроются четыре персонажа с разными управленческими подходами.</span></header><section><button aria-pressed="false"><img src="alexey.webp" alt="Мужской образ"><b>МУЖСКОЙ ОБРАЗ</b><small>Алексей · Михаил · Денис · Игорь</small></button><button aria-pressed="false"><img src="alexandra.webp" alt="Женский образ"><b>ЖЕНСКИЙ ОБРАЗ</b><small>Александра · Марина · Дарья · Ирина</small></button></section><footer>Выбор образа не влияет на условия игры и стартовые показатели.</footer></main><script>document.querySelectorAll('button').forEach(b=>b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed','false'));b.setAttribute('aria-pressed','true')})</script></body></html>
